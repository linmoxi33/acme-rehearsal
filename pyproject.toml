[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-rehearsal"
version = "0.1.0"
description = "Rehearse ACME certificate issuance, renewal and revocation in a sealed offline sandbox"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vespera" }]
keywords = ["acme", "certbot", "letsencrypt", "tls", "sandbox", "dry-run", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = ["cryptography>=42.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
acme-rehearsal = "acme_rehearsal.cli:main"

[project.urls]
Homepage = "https://github.com/linmoxi33/acme-rehearsal"
Issues = "https://github.com/linmoxi33/acme-rehearsal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001", "E501"]
# report.py embeds a CSS block and visual_check.py embeds a JS probe; wrapping
# those lines would break the languages being embedded.
"src/acme_rehearsal/report.py" = ["E501"]
"tools/*" = ["E501"]
